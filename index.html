<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xogta Hub — Xogta maanta, aragtida berri</title><meta name="description" content="Warar iyo falanqayn af-Soomaali ah. Xogta Hub."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:0 auto;padding:24px;background:#f5f7fb;color:#152238}header,article{padding:22px;background:white;border-radius:18px;margin:18px 0}h1{color:#0369a1}small{color:#64748b}</style></head><body><header><h1>Xogta Hub</h1><p>Xogta maanta, aragtida berri.</p><p>Warar iyo falanqayn af-Soomaali ah oo ku saabsan tignoolajiyada, garaadka macmalka ah, ciyaaraha iyo sayniska.</p></header><main id="news">Wararka waa la soo rarayaa…</main><script>const sb=window.supabase.createClient('https://acjxegnfrbfnouzlltlf.supabase.co','sb_publishable_L5mSPosdediQqVIau0cvGw_3dFn0YyC');(async()=>{const {data,error}=await sb.from('articles').select('title,description,category,published_at,author_name,slug').eq('status','published').order('published_at',{ascending:false}).limit(60);const root=document.getElementById('news');if(error){root.innerHTML='<article><h2>Wararka lama soo rari karin</h2><p>Fadlan mar dambe isku day.</p></article>';return}root.innerHTML=(data||[]).map(a=>`<article><small>${({ai:'AI & Tech',sports:'Ciyaaraha',nature:'Saynis & Dabeecad'}[a.category]||'Warar')} · ${new Date(a.published_at||Date.now()).toLocaleDateString('so-SO')}</small><h2>${String(a.title).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</h2><p>${String(a.description||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p><small>${a.author_name||'Xogta Hub'}</small></article>`).join('')||'<article><h2>Weli war ma jiro</h2><p>Maqaallada cusub halkan ayaa ka muuqan doona.</p></article>'})()</script></body></html>
